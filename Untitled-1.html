<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatuPersen Tracker</title>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatuPersen Tracker</title>
    
    <!-- TAMBAHIN 3 BARIS INI DI SINI -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0fdf4; 
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #64748b;
            --success-color: #10b981;
            --success-bg: #34d399; 
            --loss-color: #f43f5e;
            --loss-bg: #fb7185; 
            --empty-bg: #f1f5f9;
            --empty-text: #94a3b8;
            --border-color: #e2e8f0;
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --card-radius: 24px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --empty-bg: #334155;
            --empty-text: #64748b;
            --border-color: #334155;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; position: relative; }

        .app-container { width: 100%; max-width: 480px; padding: 24px 20px; padding-bottom: 100px; display: flex; flex-direction: column; gap: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        
        .greeting h1 { 
            font-size: 26px; font-weight: 800; letter-spacing: -0.5px; 
            cursor: pointer; display: flex; align-items: center; gap: 8px; 
            transition: opacity 0.2s;
        }
        .greeting h1:hover { opacity: 0.7; }
        .greeting p { font-size: 14px; color: var(--text-secondary); font-weight: 600; }

        .theme-toggle {
            background: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-main);
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow);
            font-size: 16px; display: flex; justify-content: center; align-items: center;
        }
        .theme-toggle:active { transform: scale(0.9); }

        .summary-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 24px; box-shadow: var(--shadow); text-align: center; }
        .summary-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        .overall-stats { display: flex; justify-content: space-around; align-items: center; }
        .stat-box h2 { font-size: 32px; font-weight: 800; margin-bottom: 2px; }
        .stat-box.success h2 { color: var(--success-color); }
        .stat-box.loss h2 { color: var(--loss-color); }
        .stat-box span { font-size: 13px; font-weight: 600; color: var(--text-secondary); }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--text-secondary);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .empty-state i { font-size: 48px; color: var(--empty-text); margin-bottom: 10px; }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .empty-state p { font-size: 14px; font-weight: 600; }

        .habit-card { background: var(--card-bg); border-radius: var(--card-radius); padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px; position: relative; }
        
        .habit-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .habit-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; flex: 1; line-height: 1.3;}
        .icon-box { width: 36px; height: 36px; background-color: var(--empty-bg); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--text-secondary); font-size: 16px; flex-shrink: 0; }
        
        .habit-actions { display: flex; gap: 8px; }
        .action-btn { background: var(--empty-bg); border: none; width: 32px; height: 32px; border-radius: 10px; color: var(--text-secondary); cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 13px; }
        .action-btn:hover { background: var(--border-color); color: var(--text-main); }
        .action-btn.delete:hover { background: var(--loss-bg); color: white; }

        .month-stats { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; padding: 12px 0; border-top: 2px dashed var(--border-color); border-bottom: 2px dashed var(--border-color); }
        .text-success { color: var(--success-color); }
        .text-loss { color: var(--loss-color); }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 16px; margin-bottom: 12px; color: var(--text-main); }
        .month-picker-btn { background: var(--empty-bg); border: none; padding: 6px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .nav-btn { background: none; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; padding: 5px 10px; border-radius: 8px; }
        .nav-btn:hover { color: var(--text-main); background: var(--empty-bg); }
        .nav-btn.disabled { opacity: 0.2; pointer-events: none; }

        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 800; color: var(--text-secondary); margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

        .date-cell {
            aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; font-size: 14px; font-weight: 700; cursor: pointer; user-select: none;
            background-color: var(--empty-bg); color: var(--empty-text);
        }
        .date-cell:active:not(.empty) { transform: scale(0.8); }
        .date-cell.success { background-color: var(--success-bg); color: white; box-shadow: 0 4px 10px rgba(52, 211, 153, 0.3); }
        .date-cell.loss { background-color: var(--loss-bg); color: white; box-shadow: 0 4px 10px rgba(251, 113, 133, 0.3); }
        .date-cell.empty { visibility: hidden; pointer-events: none; }

        /* FAB (Floating Action Button) */
        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--text-main); color: var(--bg-color); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); cursor: pointer; border: none; z-index: 50;
        }
        .fab:active { transform: scale(0.9); }

        /* MODAL CSS */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--modal-overlay); z-index: 100;
            display: none; justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.show { display: flex; }
        
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 380px; border-radius: var(--card-radius);
            padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 20px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; }
        .close-btn { background: none; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; }
        
        .picker-section h4 { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 700; text-transform: uppercase; }
        
        /* Input & Icon Picker */
        .input-field {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border-color);
            background: var(--empty-bg); color: var(--text-main); font-size: 16px; font-weight: 600; outline: none;
        }
        .input-field:focus { border-color: var(--success-bg); }
        
        .icon-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .icon-item {
            aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center;
            background: var(--empty-bg); border-radius: 12px; font-size: 20px; color: var(--text-secondary);
            cursor: pointer; border: 2px solid transparent;
        }
        .icon-item.active { background: var(--success-bg); color: white; border-color: var(--success-bg); }

        /* Year & Month Picker Scroll */
        .year-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
        .picker-item { padding: 10px 16px; background: var(--empty-bg); border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; flex-shrink: 0; border: 2px solid transparent; }
        .picker-item.active { background: var(--success-bg); color: white; }
        .picker-item.disabled { opacity: 0.3; pointer-events: none; background: transparent; border: 2px dashed var(--border-color); }
        .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .btn-apply { width: 100%; padding: 14px; background: var(--text-main); color: var(--bg-color); border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-apply:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="greeting">
                <h1 id="user-greeting" onclick="editUserName()">
                    Halo, Sobat! 👋
                </h1>
                <p>Hari ini mau lebih baik 1% di mana?</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <div class="summary-card">
            <div class="summary-title">Konsistensi Keseluruhan</div>
            <div class="overall-stats">
                <div class="stat-box success">
                    <h2 id="overall-success">0%</h2>
                    <span>Rata-rata Sukses</span>
                </div>
                <div class="stat-box loss">
                    <h2 id="overall-loss">0%</h2>
                    <span>Rata-rata Bolong</span>
                </div>
            </div>
        </div>

        <div id="habit-container" style="display: flex; flex-direction: column; gap: 24px;"></div>
    </div>

    <!-- Floating Action Button (FAB) -->
    <button class="fab" onclick="openHabitModal()"><i class="fas fa-plus"></i></button>

    <!-- MODAL KALENDER PICKER -->
    <div id="picker-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pilih Bulan</h3>
                <button class="close-btn" onclick="closePicker()"><i class="fas fa-times"></i></button>
            </div>
            <div class="picker-section"><h4>Tahun</h4><div class="year-scroll" id="year-list"></div></div>
            <div class="picker-section"><h4>Bulan</h4><div class="month-grid" id="month-list"></div></div>
            <button class="btn-apply" onclick="applyPicker()">Terapkan</button>
        </div>
    </div>

    <!-- MODAL TAMBAH KEGIATAN -->
    <div id="habit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="habit-modal-title">Tambah Kegiatan</h3>
                <button class="close-btn" onclick="closeHabitModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="picker-section">
                <h4>Nama Kegiatan</h4>
                <input type="text" id="habit-name-input" class="input-field" placeholder="Misal: Lari Pagi, Coding...">
            </div>
            <div class="picker-section">
                <h4>Pilih Ikon</h4>
                <div class="icon-grid" id="icon-list">
                    <!-- Icons will be rendered here -->
                </div>
            </div>
            <button class="btn-apply" onclick="saveHabit()">Simpan Kegiatan</button>
        </div>
    </div>

    <script>
        const actualDate = new Date();
        const actualYear = actualDate.getFullYear();
        const actualMonth = actualDate.getMonth();
        let viewedDate = new Date(); 
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const shortMonthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];

        // ==========================================
        // FITUR NAMA USER
        // ==========================================
        let userName = localStorage.getItem('satuPersenUserName');
        
        function initUserName() {
            if (!userName) {
                // Tanya nama pas pertama kali buka
                let inputName = prompt("Selamat datang di tracker 1%! Siapa nama panggilanmu?");
                userName = (inputName && inputName.trim() !== "") ? inputName.trim() : "Sobat";
                localStorage.setItem('satuPersenUserName', userName);
            }
            updateGreetingUI();
        }

        function editUserName() {
            let newName = prompt("Ubah nama panggilanmu:", userName);
            if (newName && newName.trim() !== "") {
                userName = newName.trim();
                localStorage.setItem('satuPersenUserName', userName);
                updateGreetingUI();
            }
        }

        function updateGreetingUI() {
            document.getElementById('user-greeting').innerHTML = `Halo, ${userName}! 👋 <i class="fas fa-pen" style="font-size: 14px; color: var(--text-secondary); opacity: 0.5;"></i>`;
        }

        // Jalankan inisialisasi nama
        initUserName();

        // ==========================================
        // INISIALISASI DATA KEGIATAN (KOSONG!)
        // ==========================================
        let appConfig = JSON.parse(localStorage.getItem('satuPersenConfig'));
        if (!appConfig) {
            appConfig = { startYear: actualYear, startMonth: actualMonth };
            localStorage.setItem('satuPersenConfig', JSON.stringify(appConfig));
        }

        // Pake key baru (_v5) biar bener-bener kosong buat user baru
        let habits = JSON.parse(localStorage.getItem('satuPersenData_v5')) || [];
        
        function saveData() {
            localStorage.setItem('satuPersenData_v5', JSON.stringify(habits));
            updateOverallStats();
        }

        // TEMA
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle i');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.className = 'fas fa-moon';
                localStorage.setItem('satuPersenTheme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.className = 'fas fa-sun';
                localStorage.setItem('satuPersenTheme', 'dark');
            }
        }
        if (localStorage.getItem('satuPersenTheme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-toggle i').className = 'fas fa-sun';
        }

        // ==========================================
        // FITUR TAMBAH / EDIT / HAPUS KEGIATAN
        // ==========================================
        const availableIcons = ['fa-book-open', 'fa-headphones', 'fa-laptop-code', 'fa-dumbbell', 'fa-running', 'fa-pray', 'fa-language', 'fa-wallet', 'fa-tint', 'fa-bed'];
        let selectedIcon = 'fa-book-open';
        let editingHabitId = null;

        function openHabitModal(id = null) {
            editingHabitId = id;
            document.getElementById('habit-modal').classList.add('show');
            
            if (id !== null) {
                const habitToEdit = habits.find(h => h.id === id);
                document.getElementById('habit-modal-title').innerText = "Edit Kegiatan";
                document.getElementById('habit-name-input').value = habitToEdit.name;
                selectedIcon = habitToEdit.icon;
            } else {
                document.getElementById('habit-modal-title').innerText = "Tambah Kegiatan";
                document.getElementById('habit-name-input').value = "";
                selectedIcon = availableIcons[0];
            }
            renderIcons();
        }

        function closeHabitModal() { document.getElementById('habit-modal').classList.remove('show'); }

        function renderIcons() {
            let html = '';
            availableIcons.forEach(icon => {
                const isActive = (icon === selectedIcon) ? 'active' : '';
                html += `<div class="icon-item ${isActive}" onclick="selectIcon('${icon}')"><i class="fas ${icon}"></i></div>`;
            });
            document.getElementById('icon-list').innerHTML = html;
        }

        function selectIcon(icon) {
            selectedIcon = icon;
            renderIcons();
        }

        function saveHabit() {
            const name = document.getElementById('habit-name-input').value.trim();
            if (!name) return alert("Nama kegiatan nggak boleh kosong, Bro!");

            if (editingHabitId !== null) {
                // Edit
                const index = habits.findIndex(h => h.id === editingHabitId);
                habits[index].name = name;
                habits[index].icon = selectedIcon;
            } else {
                // Tambah Baru
                const newHabit = {
                    id: Date.now(), 
                    name: name,
                    icon: selectedIcon,
                    history: {}
                };
                habits.push(newHabit);
            }
            
            saveData();
            renderHabits();
            closeHabitModal();
        }

        function deleteHabit(id) {
            if (confirm("Yakin mau hapus kegiatan ini beserta semua history-nya?")) {
                habits = habits.filter(h => h.id !== id);
                saveData();
                renderHabits();
            }
        }

        // ==========================================
        // LOGIKA TRACKING KALENDER & STATISTIK
        // ==========================================
        function changeMonth(offset) { viewedDate.setMonth(viewedDate.getMonth() + offset); renderHabits(); }

        function toggleDateStatus(habitId, day, monthKey) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit.history[monthKey]) habit.history[monthKey] = {};
            
            let currentStatus = habit.history[monthKey][day];
            if (currentStatus === undefined) habit.history[monthKey][day] = 1; 
            else if (currentStatus === 1) habit.history[monthKey][day] = 0; 
            else delete habit.history[monthKey][day]; 
            
            saveData();
            renderHabits();
        }

        function updateOverallStats() {
            if (habits.length === 0) {
                document.getElementById('overall-success').innerText = '0%';
                document.getElementById('overall-loss').innerText = '0%';
                return;
            }

            let totalOverallSuccess = 0;
            
            habits.forEach(habit => {
                let habitTotalPct = 0;
                let activeMonthsCount = 0;

                for (const monthKey in habit.history) {
                    let s = 0, l = 0;
                    Object.values(habit.history[monthKey]).forEach(val => {
                        if(val === 1) s++;
                        if(val === 0) l++;
                    });
                    
                    if (s + l > 0) {
                        habitTotalPct += (s / (s + l)) * 100;
                        activeMonthsCount++;
                    }
                }
                if (activeMonthsCount > 0) totalOverallSuccess += (habitTotalPct / activeMonthsCount);
            });

            const hasAnyData = habits.some(h => Object.keys(h.history).some(key => Object.keys(h.history[key]).length > 0));
            let finalOverallSuccess = hasAnyData ? Math.round(totalOverallSuccess / habits.length) : 0;
            let finalOverallLoss = hasAnyData ? 100 - finalOverallSuccess : 0;

            document.getElementById('overall-success').innerText = finalOverallSuccess + '%';
            document.getElementById('overall-loss').innerText = finalOverallLoss + '%';
        }

        // ==========================================
        // MODAL PICKER WAKTU
        // ==========================================
        let tempSelectedYear, tempSelectedMonth;
        function openPicker() {
            tempSelectedYear = viewedDate.getFullYear(); tempSelectedMonth = viewedDate.getMonth();
            document.getElementById('picker-modal').classList.add('show'); renderPickerUI();
        }
        function closePicker() { document.getElementById('picker-modal').classList.remove('show'); }
        function selectYear(y) {
            tempSelectedYear = y;
            if (tempSelectedYear === appConfig.startYear && tempSelectedMonth < appConfig.startMonth) tempSelectedMonth = appConfig.startMonth;
            if (tempSelectedYear === actualYear && tempSelectedMonth > actualMonth) tempSelectedMonth = actualMonth;
            renderPickerUI(); 
        }
        function selectMonth(m) { tempSelectedMonth = m; renderPickerUI(); }
        function applyPicker() { viewedDate.setFullYear(tempSelectedYear); viewedDate.setMonth(tempSelectedMonth); renderHabits(); closePicker(); }
        function renderPickerUI() {
            let yearHTML = '';
            for (let y = appConfig.startYear; y <= actualYear; y++) {
                const isActive = (y === tempSelectedYear) ? 'active' : '';
                yearHTML += `<div class="picker-item ${isActive}" onclick="selectYear(${y})">${y}</div>`;
            }
            document.getElementById('year-list').innerHTML = yearHTML;

            let monthHTML = '';
            for (let m = 0; m < 12; m++) {
                const isActive = (m === tempSelectedMonth) ? 'active' : '';
                const isDisabled = ((tempSelectedYear === appConfig.startYear && m < appConfig.startMonth) || (tempSelectedYear === actualYear && m > actualMonth)) ? 'disabled' : '';
                monthHTML += `<div class="picker-item ${isActive} ${isDisabled}" onclick="${isDisabled ? '' : `selectMonth(${m})`}">${shortMonthNames[m]}</div>`;
            }
            document.getElementById('month-list').innerHTML = monthHTML;
        }

        // ==========================================
        // RENDER HALAMAN UTAMA
        // ==========================================
        function renderHabits() {
            const container = document.getElementById('habit-container');
            container.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>Belum ada kebiasaan</h3>
                        <p>Yuk mulai tracking dengan menekan tombol + di pojok kanan bawah!</p>
                    </div>
                `;
                updateOverallStats();
                return;
            }

            const vYear = viewedDate.getFullYear();
            const vMonth = viewedDate.getMonth();
            const monthKey = `${vYear}-${vMonth}`;
            const daysInMonth = new Date(vYear, vMonth + 1, 0).getDate();
            const firstDayIndex = new Date(vYear, vMonth, 1).getDay(); 
            const isCurrentMonth = (vYear === actualYear && vMonth === actualMonth);
            const isMinMonth = (vYear === appConfig.startYear && vMonth === appConfig.startMonth);

            habits.forEach((habit) => {
                const currentMonthData = habit.history[monthKey] || {};
                let s = 0, l = 0;
                Object.values(currentMonthData).forEach(val => { if(val === 1) s++; if(val === 0) l++; });
                
                const totalMarked = s + l;
                let successPct = totalMarked === 0 ? 0 : Math.round((s / totalMarked) * 100);
                let lossPct = totalMarked === 0 ? 0 : (100 - successPct);

                let calendarCells = '';
                for(let i = 0; i < firstDayIndex; i++) calendarCells += `<div class="date-cell empty"></div>`;
                
                for(let day = 1; day <= daysInMonth; day++) {
                    let statusClass = '';
                    if (currentMonthData[day] === 1) statusClass = 'success';
                    else if (currentMonthData[day] === 0) statusClass = 'loss';
                    
                    calendarCells += `<div class="date-cell ${statusClass}" onclick="toggleDateStatus(${habit.id}, ${day}, '${monthKey}')">${day}</div>`;
                }

                const cardHTML = `
                    <div class="habit-card">
                        <div class="habit-header">
                            <div class="habit-title">
                                <div class="icon-box"><i class="fas ${habit.icon}"></i></div>
                                ${habit.name}
                            </div>
                            <div class="habit-actions">
                                <button class="action-btn" onclick="openHabitModal(${habit.id})"><i class="fas fa-pen"></i></button>
                                <button class="action-btn delete" onclick="deleteHabit(${habit.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        
                        <div class="month-stats">
                            <span class="text-success">Progres: ${successPct}%</span>
                            <span class="text-loss">Loss: ${lossPct}%</span>
                        </div>

                        <div class="calendar-wrapper">
                            <div class="calendar-header">
                                <button class="nav-btn ${isMinMonth ? 'disabled' : ''}" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                                <button class="month-picker-btn" onclick="openPicker()">${shortMonthNames[vMonth]} ${vYear} <i class="fas fa-caret-down" style="font-size: 12px;"></i></button>
                                <button class="nav-btn ${isCurrentMonth ? 'disabled' : ''}" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                            </div>
                            <div class="calendar-days">
                                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                            </div>
                            <div class="calendar-grid">
                                ${calendarCells}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            updateOverallStats();
        }

        renderHabits();
    </script>

    </script>
</body>
</html>
